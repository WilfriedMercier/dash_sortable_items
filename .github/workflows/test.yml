name: Test Suite

on:
  push:
    branches: main
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      # Clone the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python virtual environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'  # Adjust to your project's Python version

      - name: Create Python venv
        run: |
          python -m venv .venv

      # Install 'just' (command runner)
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          sudo apt install just
          just --version

      # Set up Node.js via nvm
      - name: Set up Node.js
        run: | 
          wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.7/install.sh | bash
          nvm install 
          nvm use

      # Run 'just package'
      - name: Build package
        run: |
          just package

      # Install Python package in editable mode
      - name: Install Python dependencies
        run: |
          .venv/bin/pip install -e ./

      # Set up test environment
      - name: Create test venv
        run: |
          cd test/python
          python -m venv .venv

      - name: Activate test venv and install test deps
        run: |
          ./venv/bin/pip install pytest dash[testing]

      # Run pytest
      - name: Run tests
        working-directory: test/python
        run: |
          .venv/bin/pytest

      - name: Upload test results (optional, for artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test/python/
          retention-days: 30